name: Daily story upload
on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 IST daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-hin tesseract-ocr-pan tesseract-ocr-eng
          pip install -r requirements.txt
      - run: python pipeline.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY: private        # change to public once you trust the output
      - run: |
          git config user.name "bot" && git config user.email "bot@users.noreply.github.com"
          git add state.json && git commit -m "mark uploaded" || echo "no change"
          git push
